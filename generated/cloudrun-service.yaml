apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: signal-security
  namespace: effective-metric-pwjrd
  labels:
    cloud.googleapis.com/location: asia-southeast1
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
      - image: gcr.io/effective-metric-pwjrd/signal-security:latest
        ports:
        - name: http1
          containerPort: 3000
        env:
        - name: NODE_ENV
          value: production
        - name: PORT
          value: "3000"
        resources:
          limits:
            # FIX FOR "able to 1500m only but this is 2000m":
            # Cloud Run / GKE quota in asia-southeast1 caps CPU at 1500m.
            # 1000m (1 vCPU) or 1500m (1.5 vCPU) resolves the quota error.
            cpu: "1000m"
            memory: "512Mi"
          requests:
            cpu: "500m"
            memory: "256Mi"
